# PostgreSQL Configuration for Change Data Capture (CDC)
# This configuration enables logical replication for CDC events

# -----------------------------
# WRITE-AHEAD LOG (WAL) SETTINGS
# -----------------------------

# Set WAL level to logical to support logical replication
wal_level = logical

# Increase max_wal_senders to allow replication connections
# Default is usually 10, but we'll set it higher for multiple consumers
max_wal_senders = 10

# Set max_replication_slots for logical replication slots
# Each CDC consumer typically needs one slot
max_replication_slots = 10

# WAL segment size - adjust based on your write volume
# Default is usually fine, but you can tune this
#wal_segment_size = 16MB

# -----------------------------
# REPLICATION SETTINGS
# -----------------------------

# Enable hot standby for read replicas (if needed)
hot_standby = on

# Track commit timestamps (useful for CDC ordering)
track_commit_timestamp = on

# -----------------------------
# LOGGING SETTINGS
# -----------------------------

# Enable statement logging for debugging (optional)
#log_statement = 'mod'
#log_min_duration_statement = 1000

# Log logical replication changes (for debugging)
#log_logical_decoding_error = on

# -----------------------------
# CONNECTION SETTINGS
# -----------------------------

# Allow replication connections
# This is usually set correctly by default, but explicitly setting it
listen_addresses = '*'

# Increase max_connections if you expect many CDC consumers
max_connections = 200

# -----------------------------
# PERFORMANCE TUNING
# -----------------------------

# Shared buffers - adjust based on available memory
shared_buffers = 256MB

# Effective cache size - set to ~75% of available RAM
effective_cache_size = 1GB

# Work memory per sort/hash operation
work_mem = 4MB

# Maintenance work memory for VACUUM, etc.
maintenance_work_mem = 64MB

# WAL buffers
wal_buffers = 16MB

# Checkpoint settings
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 80MB

# -----------------------------
# SECURITY SETTINGS
# -----------------------------

# Enable row level security (optional, for fine-grained access control)
#row_security = on

# -----------------------------
# ADDITIONAL CDC-SPECIFIC SETTINGS
# -----------------------------

# Logical decoding work memory
logical_decoding_work_mem = 64MB

# Maximum time to retain WAL files for replication
#wal_keep_size = 1GB

# Enable synchronous commit for critical applications
# Set to 'off' for better performance if you can tolerate some data loss risk
synchronous_commit = on

# Archive WAL files (optional, for point-in-time recovery)
#archive_mode = on
#archive_command = 'cp %p /var/lib/postgresql/data/archive/%f'